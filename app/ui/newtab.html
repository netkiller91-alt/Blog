<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <title>새 탭</title>
  <link rel="stylesheet" href="newtab.css" />
</head>
<body>
  <main>
    <div class="brand"><span>✦</span> AI 브라우저</div>
    <p class="error" id="error" hidden></p>
    <p class="lead">위 주소창에 주소를 넣거나, <b>할 일</b>을 그대로 쓰면 에이전트가 대신 해 드립니다.</p>
    <ul class="tips">
      <li><kbd>Ctrl</kbd> + <kbd>L</kbd> 주소창 · <kbd>Ctrl</kbd> + <kbd>K</kbd> 에이전트에게 맡기기 · <kbd>Ctrl</kbd> + <kbd>J</kbd> 패널 열고 닫기</li>
      <li>에이전트가 일하는 동안에도 페이지를 직접 보고 조작할 수 있습니다.</li>
      <li>결제·전송·삭제 같은 일은 하기 전에 반드시 허락을 구합니다.</li>
    </ul>
  </main>
  <script src="newtab.js"></script>
</body>
</html>
